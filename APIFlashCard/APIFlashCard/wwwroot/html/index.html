<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <header class="admin-header">
    <div class="admin-left">
        <h1>Admin Panel</h1>
    </div>

    <div class="admin-right">
        <span class="welcome-msg">Witaj, <strong id="username">Admin</strong>!</span>

        <div class="notification-container">
            <button id="notificationsBtn" class="notification">
                <span>Notifications 🔔</span>
                <span class="badge" id="badge-count">0</span>
            </button>

            <div id="notification-dropdown" class="notification-dropdown">
                <ul id="notifications">
                </ul>
            </div>
        </div>
        <button id="logoutBtn" class="btn-primary">Logout</button>
    </div>
</header>

    <div id="grid">
        <div class="card users">
            <h2>Users</h2>
            <ul id="users"></ul>
        </div>

        <div class="card logs">
            <h2>Logs</h2>
            <ul id="logs"></ul>
        </div>

        <div class="card categories">
            <h2>Categories</h2>
            <ul id="categories"></ul>

            <h3>Add Category</h3>
            <input id="categoryName" placeholder="Category Name">
            <input id="frontLang" placeholder="Front Language">
            <input id="backLang" placeholder="Back Language">
            <select id="level">
                <option value="Brak">Brak</option>
                <option value="A1">A1</option>
                <option value="A2">A2</option>
                <option value="B1">B1</option>
                <option value="B2">B2</option>
                <option value="C1">C1</option>
                <option value="C2">C2</option>
            </select>
            <button id="addCategoryBtn" class="btn-primary">Add Category</button>
        </div>

        <div class="card flashcards">
            <h2>FlashCards</h2>
            <div id="flashcardSection">
                <h3 id="flashcardsTitle">Select a category to see its flashcards.</h3>

                <table id="flashcardsTable" class="flashcards-table" style="display:none;">
                    <thead>
                        <tr>
                            <th>Question</th>
                            <th>Answer</th>
                        </tr>
                    </thead>
                    <tbody id="flashcardsBody"></tbody>
                </table>

                <div id="flashcardForm" style="display:none;">
                    <h4>Add FlashCard</h4>
                    <input id="flashcardQuestion" placeholder="Question" required>
                    <input id="flashcardAnswer" placeholder="Answer" required>
                    <button id="addFlashcardBtn" class="btn-primary">Add FlashCard</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/index.js"></script>
</body>
</html>
