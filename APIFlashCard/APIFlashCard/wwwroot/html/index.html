<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <header>
        <h1>Admin Panel</h1>
        <button onclick="logout()">Logout</button>
    </header>

    <div id="grid">
        <div class="card">
            <h2>Users</h2>
            <ul id="users"></ul>
        </div>

        <div class="card">
            <h2>Logs</h2>
            <ul id="logs"></ul>
        </div>

        <div class="card">
            <h2>Categories</h2>
            <ul id="categories"></ul>

            <h3>Add Category</h3>
            <input id="categoryName" placeholder="Category Name">
            <input id="frontLang" placeholder="Front Language">
            <input id="backLang" placeholder="Back Language">
            <input id="level" placeholder="Level (optional)">
            <button id="addCategoryBtn">Add Category</button>
        </div>

        <div class="card">
            <h2>FlashCards</h2>
            <div id="flashcardSection">
                <h3 id="flashcardsTitle">Select a category to see its flashcards.</h3>
                <table id="flashcardsTable" class="flashcards-table" style="display:none;">
                    <thead>
                        <tr>
                            <th>Question</th>
                            <th>Answer</th>
                        </tr>
                    </thead>
                    <tbody id="flashcardsBody"></tbody>
                </table>

                <div id="flashcardForm" style="display:none;">
                    <h4>Add FlashCard</h4>
                    <input id="flashcardQuestion" placeholder="Question" required>
                    <input id="flashcardAnswer" placeholder="Answer" required>
                    <button id="addFlashcardBtn">Add FlashCard</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/index.js"></script>
</body>
</html>
